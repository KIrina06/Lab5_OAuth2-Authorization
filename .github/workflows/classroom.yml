name: GitHub Classroom Workflow
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push images
        run: docker compose build --push

      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure YC
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > key.json
          yc config profile create github-actions
          yc config set service-account-key key.json
          yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"

      - name: Configure kubectl
        run: |
          yc managed-kubernetes cluster get-credentials car-rental-cluster --external --force

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install car-rental ./helm/app

      - name: Wait for services
        run: |
          kubectl rollout status deployment/gateway-service --timeout=180s
          kubectl rollout status deployment/cars-service --timeout=180s
          kubectl rollout status deployment/rental-service --timeout=180s
          kubectl rollout status deployment/payment-service --timeout=180s

      - name: Export auth env
        run: |
          echo "CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}" >> $GITHUB_ENV
          echo "CLIENT_SECRET=${{ secrets.AUTH0_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "AUTH_USERNAME=${{ secrets.AUTH0_USERNAME }}" >> $GITHUB_ENV
          echo "AUTH_PASSWORD=${{ secrets.AUTH0_PASSWORD }}" >> $GITHUB_ENV

      - name: Patch Postman environment
        run: |
          jq '.values |= map(
            if .key == "serviceUrl" then .value = "http://111.88.157.16"
            elif .key == "identityProviderUrl" then .value = "https://dev-5o8igifch4ha6z4p.us.auth0.com"
            elif .key == "clientId" then .value = "${{ secrets.AUTH0_CLIENT_ID }}"
            elif .key == "clientSecret" then .value = "${{ secrets.AUTH0_CLIENT_SECRET }}"
            elif .key == "username" then .value = "${{ secrets.AUTH0_USERNAME }}"
            elif .key == "password" then .value = "${{ secrets.AUTH0_PASSWORD }}"
            else .
            end
          )' v3/postman/environment.json > environment.tmp.json
          mv environment.tmp.json v3/postman/environment.json

      - name: Autograding
        uses: education/autograding@v1
